{% extends 'school_admin/base.html' %}

{% block title %}Add Staff Payment{% endblock title %}

{% block content %}
<div class="flex-1 bg-sky-50 font-['Inter'] min-h-screen">
    <div class="bg-white px-4 sm:px-6 lg:px-8 py-5 sm:py-6 shadow-lg mb-6 sm:mb-10">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-9 bg-rose-700 rounded-full"></div>
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-slate-900">Add Staff Payment</h1>
        </div>
    </div>

    <div class="px-4 sm:px-6 md:px-16 lg:px-[10%] xl:px-[15%] pb-10">
        <div class="bg-white rounded-2xl border border-slate-300 shadow-xl overflow-hidden">

            <div class="px-5 sm:px-6 md:px-8 py-5 border-b border-slate-200 bg-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-lime-300 text-red-700 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-800">Staff Payment Details</h2>
                </div>
            </div>

            <div class="p-5 sm:p-6 md:p-8">
                <form method="POST">
                    {% csrf_token %}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Staff</label>
                            <select name="staff" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                                <option value="">Select Staff</option>
                                {% for staff in staffs %}
                                    <option value="{{ staff.id }}" {% if payment.staff.id == staff.id %}selected{% endif %}>
                                        {{ staff.name }} - {{ staff.staff_type }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Basic Salary</label>
                            <input type="number" name="basic_salary" step="0.01" min="0" value="{{payment.basic_salary}}" placeholder="Enter basic salary" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Allowances</label>
                            <input type="number" name="allowances" step="0.01" min="0" value="{{payment.allowances}}" placeholder="Enter allowances" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Deductions</label>
                            <input type="number" name="deductions" step="0.01" min="0" value="{{payment.deductions}}" placeholder="Enter deductions" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Payment Status</label>
                            <select name="status" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                                {% for value, label in payment_status %}
                                    <option value="{{ value }}" {% if payment.status == value %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Payment Method</label>
                            <select name="payment_method" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                                {% for value, label in payment_methods %}
                                    <option value="{{ value }}" {% if payment.payment_method == value %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Payment Date</label>
                            <input type="date" name="payment_date" value="{{payment.payment_date|date:"Y-m-d"}}" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Notes</label>
                            <textarea name="notes" rows="4" placeholder="Enter any additional notes" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">{{payment.notes}}</textarea>
                        </div>

                    </div>

                    <div class="mt-6 bg-slate-50 border border-slate-200 rounded-xl p-4">
                        <p class="text-sm text-slate-600">
                            <span class="font-medium text-slate-700">Net Salary </span>will be calculated automatically:
                        </p>
                        <p class="text-sm text-slate-500 mt-1">Basic Salary + Allowances − Deductions</p>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-400 flex flex-col sm:flex-row sm:justify-end gap-3">
                        <button type="submit" class="w-full sm:w-auto px-7 py-3 rounded-xl bg-sky-700 text-white text-md font-semibold shadow-md transition duration-200 hover:bg-blue-500 hover:shadow-xl">Save Payment</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
