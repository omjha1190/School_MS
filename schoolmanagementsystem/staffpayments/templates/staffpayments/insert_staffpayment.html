{% extends 'school_admin/base.html' %}

{% block title %}Add Staff Payment{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Staff Payment</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Staff</label>
                        <select name="staff" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Staff</option>
                            {% for staff in staffs %}
                                <option value="{{ staff.id }}" {% if payment.staff.id == staff.id %}selected{% endif %}>
                                    {{ staff.name }} - {{ staff.staff_type }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Basic Salary</label>
                        <input type="number" name="basic_salary" step="0.01" min="0" value="{{payment.basic_salary}}" placeholder="Enter basic salary" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Allowances</label>
                        <input type="number" name="allowances" step="0.01" min="0" value="{{payment.allowances}}" value="{{payment.allowances}}" placeholder="Enter allowances" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Deductions</label>
                        <input type="number" name="deductions" step="0.01" min="0" value="{{payment.deductions}}" value="{{payment.deductions}}" placeholder="Enter deductions" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Payment Status</label>
                        <select name="status" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            {% for value, label in payment_status %}
                                <option value="{{ value }}" {% if payment.status == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Payment Method</label>
                        <select name="payment_method" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            {% for value, label in payment_methods %}
                                <option value="{{ value }}" {% if payment.payment_method == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Payment Date</label>
                        <input type="date" name="payment_date" value="{{payment.payment_date|date:"Y-m-d"}}" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Notes</label>
                        <textarea name="notes" rows="4" placeholder="Enter any additional notes" class="w-full border border-slate-300 rounded-lg px-4 py-3">{{payment.notes}}</textarea>
                    </div>
                </div>
                <div class="mt-6 bg-slate-50 border border-slate-200 rounded-lg p-4">
                    <p class="text-sm text-slate-600">
                        <span class="font-medium text-slate-700">Net Salary </span>will be calculated automatically:</p>
                    <p class="text-sm text-slate-500 mt-1">Basic Salary + Allowances − Deductions</p>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Save Payment</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
