{% extends 'school_admin/base.html' %}

{% block title %}Add Teacher{% endblock title %}

{% block content %}

<div class="min-h-screen w-full bg-gradient-to-br from-sky-100 via-indigo-50 to-violet-100 px-4 py-5 md:px-6 md:py-6">
    <div class="w-full">
        <div class="mb-6 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div>
                <p class="mb-1.5 inline-flex items-center rounded-full bg-cyan-100 px-3 py-1 text-xs font-semibold uppercase tracking-[0.2em] text-cyan-700">Teacher Portal</p>
                <h1 class="text-3xl font-bold tracking-tight text-slate-800 md:text-4xl">Add New Teacher</h1>
            </div>
        </div>
        <div class="w-full overflow-hidden rounded-[26px] border border-white/70 bg-white/80 p-4 shadow-[0_15px_45px_rgba(15,23,42,0.10)] backdrop-blur-sm md:p-6">
            <form method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                <section class="rounded-3xl border border-cyan-100 bg-gradient-to-r from-cyan-50 via-white to-indigo-50 p-5 md:p-6">
                    <div class="mb-5 flex items-center gap-3">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-cyan-500 text-lg font-bold text-white shadow-md shadow-cyan-200">1</div>
                        <h2 class="text-xl font-bold text-slate-800 md:text-2xl">Account Information</h2>
                    </div>
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                        <div>
                            <label for="first_name" class="mb-1.5 block text-sm font-semibold text-slate-700">First Name</label>
                            <input type="text" id="first_name" name="first_name" value="{{teacher.user.first_name}}" placeholder="Enter first name" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm transition focus:border-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-100">
                        </div>
                        <div>
                            <label for="last_name" class="mb-1.5 block text-sm font-semibold text-slate-700">Last Name</label>
                            <input type="text" id="last_name" name="last_name" value="{{teacher.user.last_name}}" placeholder="Enter last name" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm transition focus:border-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-100">
                        </div>
                        <div>
                            <label for="username" class="mb-1.5 block text-sm font-semibold text-slate-700">Username</label>
                            <input type="text" id="username" name="username" value="{{teacher.user.username}}" placeholder="Enter username" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm transition focus:border-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-100">
                        </div>
                        <div>
                            <label for="email" class="mb-1.5 block text-sm font-semibold text-slate-700">Email</label>
                            <input type="email" id="email" name="email" value="{{teacher.user.email}}" placeholder="Enter email address" class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm transition focus:border-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-100">
                        </div>
                        <div>
                            <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter password" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm transition focus:border-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-100">
                        </div>
                        <div>
                            <label for="confirm_password" class="mb-1.5 block text-sm font-semibold text-slate-700">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm transition focus:border-cyan-400 focus:outline-none focus:ring-4 focus:ring-cyan-100">
                        </div>
                    </div>
                </section>
                <section class="rounded-3xl border border-violet-100 bg-gradient-to-r from-violet-50 via-white to-fuchsia-50 p-5 md:p-6">
                    <div class="mb-5 flex items-center gap-3">
                        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-violet-500 text-lg font-bold text-white shadow-md shadow-violet-200">2</div>
                        <h2 class="text-xl font-bold text-slate-800 md:text-2xl">Teacher Information</h2>
                    </div>
                    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                        <div>
                            <label for="phone" class="mb-1.5 block text-sm font-semibold text-slate-700">Phone Number</label>
                            <input type="text" id="phone" name="phone" value="{{teacher.phone}}" placeholder="Enter phone number" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100">
                        </div>
                        <div>
                            <label for="qualification" class="mb-1.5 block text-sm font-semibold text-slate-700">Qualification</label>
                            <input type="text" id="qualification" name="qualification" value="{{teacher.qualification}}" placeholder="e.g. B.Ed, M.Sc, M.A" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100">
                        </div>
                        <div>
                            <label for="subject" class="mb-1.5 block text-sm font-semibold text-slate-700">Subject</label>
                            <select id="subject" name="subject" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100">
                                <option value="">Select Subject</option>
                                {% for subject in subjects %}
                                    <option value="{{ subject.id }}" {% if teacher.subject and teacher.subject.id == subject.id %}selected{% endif %}>
                                        {{ subject.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="joining_date" class="mb-1.5 block text-sm font-semibold text-slate-700">Joining Date</label>
                            <input type="date" id="joining_date" name="joining_date" value="{{teacher.joining_date|date:'Y-m-d' }}" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100">
                        </div>
                        <div>
                            <label for="gender" class="mb-1.5 block text-sm font-semibold text-slate-700">Gender</label>
                            <select id="gender" name="gender" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100">
                                <option value="">Select Gender</option>
                                <option value="male" {% if teacher.gender == 'male' %}selected{% endif %}>Male</option>
                                <option value="female" {% if teacher.gender == 'female' %}selected{% endif %}>Female</option>
                                <option value="other" {% if teacher.gender == 'other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div>
                            <label for="cover_image" class="mb-1.5 block text-sm font-semibold text-slate-700">Cover Image</label>
                            <input type="file" id="cover_image" name="cover_image" accept="image/*" class="block w-full rounded-xl border border-dashed border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-600 file:mr-4 file:rounded-full file:border-0 file:bg-violet-500 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white">
                        </div>
                        <div class="md:col-span-2">
                            <label for="address" class="mb-1.5 block text-sm font-semibold text-slate-700">Address</label>
                            <textarea id="address" name="address" rows="4" placeholder="Enter address" required class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-slate-700 shadow-sm focus:border-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-100">{{teacher.address}}</textarea>
                        </div>
                    </div>
                    <div class="mt-5 rounded-xl bg-gradient-to-r from-amber-100 to-orange-100 px-4 py-3">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" name="is_class_teacher"
                                {% if teacher.is_class_teacher %}checked{% endif %} class="mt-1 h-5 w-5 rounded border-slate-300">
                            <div>
                                <p class="text-sm font-semibold text-amber-800">Class Teacher</p>
                                <p class="mt-1 text-sm text-amber-700">Mark this teacher as a class teacher.</p>
                            </div>
                        </label>
                    </div>
                </section>
                <div class="flex justify-end pt-1">
                    <button type="submit" class="inline-flex w-full items-center justify-center rounded-xl bg-cyan-600 px-7 py-3.5 text-base font-semibold text-white shadow-lg transition duration-200 hover:-translate-y-0.5 hover:shadow-xl md:w-auto">Create Teacher</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
