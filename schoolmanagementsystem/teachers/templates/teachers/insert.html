{% extends 'school_admin/base.html' %}

{% block title %}Add Teacher{% endblock title %}


{% block content %}
<div class="ml-64 flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Teacher</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Account Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="first_name" class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                            <input type="text" id="first_name" name="first_name" value="{{teacher.user.first_name}}" placeholder="Enter first name" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                        </div>
                        <div>
                            <label for="last_name" class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                            <input type="text" id="last_name" name="last_name" value="{{teacher.user.last_name}}" placeholder="Enter last name" required class="w-full border border-slate-300 rounded-lg px-4 py-3" >
                        </div>
                        <div>
                            <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                            <input type="text" id="username" name="username" value="{{teacher.user.username}}" placeholder="Enter username" required class="w-full border border-slate-300 rounded-lg px-4 py-3" >
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                            <input type="email" id="email" name="email" value="{{teacher.user.email}}" placeholder="Enter email address" class="w-full border border-slate-300 rounded-lg px-4 py-3" >
                        </div>
                        <div>
                            <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter password" required class="w-full border border-slate-300 rounded-lg px-4 py-3" >
                        </div>
                        <div>
                            <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-2">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required class="w-full border border-slate-300 rounded-lg px-4 py-3" >
                        </div>
                    </div>
                </div>
                <div class="border-t border-slate-200 my-8"></div>
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Teacher Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="phone" class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
                            <input type="text" id="phone" name="phone" value="{{teacher.phone}}" placeholder="Enter phone number" required class="w-full border border-slate-300 rounded-lg px-4 py-3" >
                        </div>
                        <div>
                            <label for="qualification" class="block text-sm font-medium text-slate-700 mb-2">Qualification</label>
                            <input type="text" id="qualification" name="qualification" value="{{teacher.qualification}}" placeholder="e.g. B.Ed, M.Sc, M.A"required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                        </div>
                        <div>
                            <label for="joining_date" class="block text-sm font-medium text-slate-700 mb-2">Joining Date</label>
                            <input type="date" id="joining_date" name="joining_date" value="{{teacher.joining_date|date:'Y-m-d' }}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                        </div>
                        <div>
                            <label for="address" class="block text-sm font-medium text-slate-700 mb-2">Address</label>
                            <textarea id="address" name="address" rows="3" placeholder="Enter address" required class="w-full border border-slate-300 rounded-lg px-4 py-3" >{{teacher.address}}</textarea>
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-slate-700 mb-2">Gender</label>
                            <select id="gender" name="gender" value="{{teacher.gender}}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label for="cover_image" class="block text-sm font-medium text-slate-700 mb-2">Cover Image</label>
                            <input type="file" id="cover_image" name="cover_image" value="{{teacher.cover_image}}" accept="image/*" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" name="is_class_teacher" {% if teacher.is_class_teacher %}checked{% endif %} class="mt-1 h-5 w-5 rounded border-slate-300" >
                            <div>
                                <p class="text-sm font-medium text-slate-700">Class Teacher</p>
                                <p class="text-sm text-slate-500 mt-1">Mark this teacher as a class teacher.</p>
                            </div>
                        </label>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-5">Create Teacher</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
