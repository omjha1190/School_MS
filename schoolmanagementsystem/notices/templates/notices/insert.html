{% extends 'school_admin/base.html' %}

{% block title %}Add Notice{% endblock title %}

{% block content %}

<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Notice</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Notice Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="col-span-2">
                            <label for="title" class="block text-sm font-medium text-slate-700 mb-2">Notice Title</label>
                            <input type="text" id="title" name="title" value="{{notice.title}}" placeholder="e.g. Parent-Teacher Meeting" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md ">
                        </div>
                        <div>
                            <label for="date" class="block text-sm font-medium text-slate-700 mb-2">Notice Date</label>
                            <input type="date" id="date" name="date" value="{{notice.date|date:'Y-m-d'}}" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label for="description" class="block text-sm font-medium text-slate-700 mb-2">Notice Description</label>
                        <textarea id="description" name="description" rows="7" placeholder="Write the notice details here..." class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">{{notice.description}}</textarea>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Create Notice</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
