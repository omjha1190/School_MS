{% extends 'school_admin/base.html' %}

{% block title %}Add Student{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Student</h1>
        <div class="p-8 bg-white rounded-xl border border-slate-200 shadow-sm ">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Account Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="first_name" class="block text-sm font-medium text-slate-700 mb-2">First Name</label>
                            <input type="text" id="first_name" name="first_name" value="{{ student.user.first_name }}" placeholder="Enter first name" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="last_name" class="block text-sm font-medium text-slate-700 mb-2">Last Name</label>
                            <input type="text" id="last_name" name="last_name" value="{{ student.user.last_name }}" placeholder="Enter last name" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                            <input type="text" id="username" name="username" value="{{ student.user.username }}" placeholder="Enter username" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                            <input type="email" id="email" name="email" value="{{ student.user.email }}" placeholder="Enter email address" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div class="">
                            <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter password" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-2">Confirm Password</label>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md" >
                        </div>
                    </div>
                </div>
                <div class="border-t border-slate-200 my-8"></div>
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Student Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="admission_number" class="block text-sm font-medium text-slate-700 mb-2">Admission Number</label>
                            <input type="text" id="admission_number" name="admission_number" value="{{ student.admission_number }}" placeholder="e.g. ADM2026001" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
                            <input type="text" id="phone" name="phone" value="{{ student.phone }}" placeholder="e.g. 9876543210" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-slate-700 mb-2">Gender</label>
                            <select id="gender" name="gender" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div>
                            <label for="date_of_birth" class="block text-sm font-medium text-slate-700 mb-2">Date of Birth</label>
                            <input type="date" id="date_of_birth" name="date_of_birth" value="{{ student.date_of_birth|date:'Y-m-d' }}" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="admission_date" class="block text-sm font-medium text-slate-700 mb-2">Admission Date</label>
                            <input type="date" id="admission_date" name="admission_date" value="{{ student.admission_date|date:'Y-m-d' }}" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="schoolclass" class="block text-sm font-medium text-slate-700 mb-2">Class</label>
                            <select id="schoolclass" name="schoolclass" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                                <option value="">Select Class</option>
                                {% for schoolclass in schoolclasses %}
                                    <option value="{{ schoolclass.id }}"
                                        {% if student.schoolclass.id == schoolclass.id %}selected{% endif %}>
                                        {{ schoolclass.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="section" class="block text-sm font-medium text-slate-700 mb-2">Section</label>
                            <select id="section" name="section" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                                <option value="">Select Section</option>
                                {% for section in sections %}
                                    <option value="{{ section.id }}"
                                        {% if student.section.id == section.id %}selected{% endif %}>
                                       {{ section.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="cover_image" class="block text-sm font-medium text-slate-700 mb-2">Cover Image</label>
                            <input type="file" id="cover_image" name="cover_image" value="{{student.cover_image}}" accept="image/*" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                    </div>
                    <div>
                        <label for="address" class="block text-sm font-medium text-slate-700 mb-2 mt-6">Address</label>
                        <textarea id="address" name="address" rows="6" placeholder="Enter student's full address" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">{{student.address}}</textarea>
                    </div>
                </div>
                <div class="border-t border-slate-200 my-8"></div>
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Parent / Guardian Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="parent_name" class="block text-sm font-medium text-slate-700 mb-2">Parent / Guardian Name</label>
                            <input type="text" id="parent_name" name="parent_name" value="{{ student.parent_name }}" placeholder="e.g. Rajesh Sharma" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="parent_phone" class="block text-sm font-medium text-slate-700 mb-2">Parent / Guardian Phone</label>
                            <input type="text" id="parent_phone" name="parent_phone" value="{{ student.parent_phone }}" placeholder="e.g. 9876543210" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-5">Create Student</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
