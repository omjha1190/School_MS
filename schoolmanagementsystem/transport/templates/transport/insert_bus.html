{% extends 'school_admin/base.html' %}

{% block title %}Add Bus{% endblock title %}

{% block content %}

<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Bus</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Bus Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="bus_number" class="block text-sm font-medium text-slate-700 mb-2">Bus Number</label>
                            <input type="text" id="bus_number" name="bus_number" value="{{bus.bus_number}}" placeholder="e.g. BUS-01" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                        </div>
                        <div>
                            <label for="registration_number" class="block text-sm font-medium text-slate-700 mb-2">Registration Number</label>
                            <input type="text" id="registration_number" name="registration_number" value="{{bus.registration_number}}" placeholder="e.g. BR-11-AB-1234" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                        </div>
                        <div>
                            <label for="route" class="block text-sm font-medium text-slate-700 mb-2">Route</label>
                            <input type="text" id="route" name="route" value="{{bus.route}}" placeholder="e.g. Main Road - School" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                        </div>
                        <div>
                            <label for="driver" class="block text-sm font-medium text-slate-700 mb-2">Driver</label>
                            <select id="driver" name="driver" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                                <option value="">Select Driver</option>
                                {% for driver in drivers %}
                                    <option value="{{ driver.id }}">
                                        {{ driver.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Add Bus</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
