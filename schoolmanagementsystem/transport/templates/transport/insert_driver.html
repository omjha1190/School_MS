{% extends 'school_admin/base.html' %}

{% block title %}Add Driver{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Driver</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Driver Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Driver Name</label>
                            <input type="text" id="name" name="name" value="{{driver.name}}" placeholder="Enter driver name" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
                            <input type="text" id="phone" name="phone" value="{{driver.phone}}" placeholder="e.g. 9876543210" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="license_number" class="block text-sm font-medium text-slate-700 mb-2">License Number</label>
                            <input type="text" id="license_number" name="license_number" value="{{driver.license_number}}" placeholder="Enter license number" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                        <div>
                            <label for="cover_image" class="block text-sm font-medium text-slate-700 mb-2">Cover Image</label>
                            <input type="file" id="cover_image" name="cover_image" value="{{driver.cover_image}}" accept="image/*" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label for="address" class="block text-sm font-medium text-slate-700 mb-2">Address</label>
                        <textarea id="address" name="address" rows="5" placeholder="Enter driver's full address" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm hover:shadow-md">{{driver.address}}</textarea>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Add Driver</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
