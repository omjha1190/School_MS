{% extends 'school_admin/base.html' %}

{% block title %}Add Teacher Assignment{% endblock title %}

{% block content %}
<div class="flex-1">
    <div class="flex items-center bg-white px-8 py-5 shadow-lg mb-10">
        <h1 class="text-3xl font-semibold text-slate-800">Add Teacher Assignment</h1>
    </div>
    <div class="px-[30%]">
        <div class="bg-white rounded-xl border border-slate-200 shadow-lg p-8">
            <form method="POST">
                {% csrf_token %}
                <div>
                    <label for="teacher" class="block text-sm font-medium text-slate-700 mb-4">Select Teacher</label>
                    <select id="teacher" name="teacher" class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
                        <option value="">Select Teacher</option>
                        {% for teacher in teachers %}
                            <option value="{{ teacher.id }}">
                                {{ teacher.user.get_full_name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mt-6">
                    <label for="subject" class="block text-sm font-medium text-slate-700 mb-4">Select Subject</label>
                    <select id="subject" name="subject" class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
                        <option value="">Select Subject</option>
                        {% for subject in subjects %}
                            <option value="{{ subject.id }}">
                                {{ subject.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mt-6">
                    <label for="schoolclass" class="block text-sm font-medium text-slate-700 mb-4">Select Class</label>
                    <select id="schoolclass" name="schoolclass" class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
                        <option value="">Select Class</option>
                        {% for schoolclass in schoolclasses %}
                            <option value="{{ schoolclass.id }}">
                                {{ schoolclass.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mt-6">
                    <label for="section" class="block text-sm font-medium text-slate-700 mb-4">Select Section</label>
                    <select id="section" name="section" class="w-full border border-slate-300 rounded-lg px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-400">
                        <option value="">Select Section</option>
                        {% for section in sections %}
                            <option value="{{ section.id }}">
                                {{ section.schoolclass.name }} - {{ section.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Assign Teacher</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
