{% extends 'school_admin/base.html' %}

{% block title %}Add Section{% endblock title %}


{% block content %}
<div class="flex-1 ">
    <div>
        <div class="flex items-center bg-white px-8 py-5 shadow-lg mb-10">
            <h1 class="text-3xl font-semibold text-slate-800">Add Section</h1>
        </div>
        <div class="px-[30%]">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-6">
                        <label for="schoolclass" class="block text-sm font-medium text-slate-700 mb-2">Class</label>
                        <select id="schoolclass" name="schoolclass" class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-500">
                            <option value="">Select Class</option>
                            {% for class in schoolclass %}
                                <option value="{{ class.id }}">
                                    {{ class.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Section Name</label>
                        <input type="text" id="name" name="name" placeholder="e.g. A" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <button type="submit" class=" w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-4">Add Section</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
