{% extends 'school_admin/base.html' %}

{% block title %}Add Subject{% endblock title %}


{% block content %}
<div class="flex-1 ">
    <div>
        <div class="flex items-center bg-white px-8 py-5 shadow-lg mb-10">
            <h1 class="text-3xl font-semibold text-slate-800">Add Subject</h1>
        </div>
        <div class="px-[30%]">
            <div class="bg-white rounded-xl border border-slate-200 shadow-lg p-8">
                <form method="POST">
                    {% csrf_token %}
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-4">Subject Name</label>
                        <input type="text" id="name" name="name" placeholder="e.g. Science" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div class="mt-6">
                        <label class="block text-sm font-medium text-slate-700 mb-4">Select Classes</label>
                        <div class="grid grid-cols-2 gap-3">
                            {% for schoolclass in schoolclasses %}
                                <label class="flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 cursor-pointer hover:bg-slate-50">
                                    <input type="checkbox" name="schoolclasses" value="{{ schoolclass.id }}" class="w-4 h-4">
                                    <span class="text-slate-700">{{ schoolclass.name }}</span>
                                </label>
                            {% endfor %}
                        </div>
                    </div>
                    <button type="submit" class=" w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Add Subject</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
