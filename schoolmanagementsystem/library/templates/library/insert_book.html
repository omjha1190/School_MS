{% extends 'school_admin/base.html' %}

{% block title %}Add Book{% endblock title %}

{% block content %}
<div class="flex-1 min-w-0 bg-violet-200 min-h-screen p-4 sm:p-6 lg:p-8">
    <div class="max-w-6xl mx-auto">
        <div class="mb-6 sm:mb-8">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-2 h-8 bg-orange-500 rounded-full"></div>
                <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Add New Book</h1>
            </div>
        </div>
        <div class="bg-white border border-amber-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="bg-slate-900 px-5 sm:px-8 py-5 sm:py-6">
                <div class="flex items-center gap-4">
                    <div class="w-11 h-11 rounded-xl bg-rose-500 flex items-center justify-center text-white text-xl font-bold shrink-0">+</div>
                    <h2 class="text-lg sm:text-xl font-semibold text-white">New Book Entry</h2>
                </div>
            </div>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="p-5 sm:p-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Book Title</label>
                            <input type="text" name="title" value="{{book.title}}" required placeholder="Enter book title" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200  focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Author</label>
                            <input type="text" name="author" value="{{book.author}}" required placeholder="Enter author name" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">ISBN</label>
                            <input type="text" name="isbn" value="{{book.isbn}}" required placeholder="Enter ISBN" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Category</label>
                            <select name="category" required class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                                <option value="">Select Category</option>
                                {% for value, label in categories %}
                                    <option value="{{ value }}"
                                        {% if book.category == value %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Subject</label>
                            <select name="subject" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                                <option value="">Select Subject</option>
                                {% for subject in subjects %}
                                    <option value="{{ subject.id }}"
                                        {% if book.subject.id == subject.id %}selected{% endif %}>
                                        {{ subject.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Publisher</label>
                            <input type="text" name="publisher" value="{{book.publisher}}" placeholder="Enter publisher name" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Quantity</label>
                            <input type="number" name="quantity" min="1" value="{{book.quantity}}" required placeholder="Enter quantity" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Shelf Number</label>
                            <input type="text" name="shelf_number" value="{{book.shelf_number}}" placeholder="Example: A-01" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 focus:border-rose-400 focus:ring-2 focus:ring-rose-100">
                        </div>
                        <div>
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Cover Image</label>
                            <input type="file" name="cover_image" accept="image/*" class="w-full bg-white border border-amber-300 rounded-xl px-3 py-2.5 text-slate-500 cursor-pointer file:mr-4 file:rounded-lg file:border-0 file:bg-slate-900 file:px-4 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-slate-800">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-lg font-semibold text-slate-800 mb-1">Description</label>
                            <textarea name="description" rows="5" placeholder="Enter book description" class="w-full bg-white border border-amber-300 rounded-xl px-4 py-3 text-slate-900 outline-none transition duration-200 resize-none focus:border-rose-400 focus:ring-2 focus:ring-rose-100">{{book.description}}</textarea>
                        </div>
                    </div>
                    <div class="mt-8 pt-6 border-t border-amber-300 flex flex-col sm:flex-row sm:justify-end gap-3">
                        <button type="submit" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-red-600 text-white text-sm font-semibold shadow-sm transition duration-200 hover:bg-red-700 hover:shadow-md active:scale-[0.98]">Save Book</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
