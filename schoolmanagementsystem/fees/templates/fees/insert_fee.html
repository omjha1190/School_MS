{% extends 'school_admin/base.html' %}

{% block title %}Add Fee{% endblock title %}

{% block content %}

<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Fee</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Student</label>
                        <select name="student" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Student</option>
                            {% for student in students %}
                                <option value="{{ student.id }}" {% if fee.student.id == student.id %}selected{% endif %}>
                                    {{ student }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Fee Type</label>
                        <select name="fee_type" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Fee Type</option>
                            <option value="Tuition" {% if fee.fee_type == "Tuition" %}selected{% endif %}>Tuition Fee</option>
                            <option value="Admission" {% if fee.fee_type == "Admission" %}selected{% endif %}>Admission Fee</option>
                            <option value="Registration" {% if fee.fee_type == "Registration" %}selected{% endif %}>Registration Fee</option>
                            <option value="Annual" {% if fee.fee_type == "Annual" %}selected{% endif %}>Annual Fee</option>
                            <option value="Examination" {% if fee.fee_type == "Examination" %}selected{% endif %}>Examination Fee</option>
                            <option value="Transport" {% if fee.fee_type == "Transport" %}selected{% endif %}>Transport Fee</option>
                            <option value="Library" {% if fee.fee_type == "Library" %}selected{% endif %}>Library Fee</option>
                            <option value="Computer/Lab" {% if fee.fee_type == "Computer/Lab" %}selected{% endif %}>Computer/Lab Fee</option>
                            <option value="Activity" {% if fee.fee_type == "Activity" %}selected{% endif %}>Activity Fee</option>
                            <option value="Sports" {% if fee.fee_type == "Sports" %}selected{% endif %}>Sports Fee</option>
                            <option value="Miscellaneous" {% if fee.fee_type == "Miscellaneous" %}selected{% endif %}>Miscellaneous Fee</option>
                            <option value="Late" {% if fee.fee_type == "Late" %}selected{% endif %}>Late Fee</option>
                            <option value="Hostel" {% if fee.fee_type == "Hostel" %}selected{% endif %}>Hostel Fee</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Amount</label>
                        <input type="number" name="amount" step="0.01" value="{{fee.amount}}" placeholder="Enter amount" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Due Date</label>
                        <input type="date" name="due_date" value="{{fee.due_date|date:'Y-m-d'}}" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Paid Date</label>
                        <input type="date" name="paid_date" value="{{fee.paid_date|date:'Y-m-d'}}" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Status</label>
                        <select name="status" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="Pending" {% if fee.status == "Pending" %}selected{% endif %}>Pending</option>
                            <option value="Paid" {% if fee.status == "Paid" %}selected{% endif %}>Paid</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-4 mt-8">
                    <button type="submit" class="px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700">Save Fee</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
