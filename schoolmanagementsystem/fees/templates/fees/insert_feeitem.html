{% extends 'school_admin/base.html' %}

{% block title %}Add Fee Item{% endblock title %}

{% block content %}
<div class="flex-1 bg-sky-50 font-['Inter'] min-h-screen">
    <div class="bg-white px-4 sm:px-6 lg:px-8 py-5 sm:py-6 shadow-lg mb-6 sm:mb-10">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-9 bg-rose-700 rounded-full"></div>
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-slate-900">Add Fee Item</h1>
        </div>
    </div>

    <div class="px-4 sm:px-8 md:px-16 lg:px-[20%] xl:px-[30%] pb-10">
        <div class="bg-white rounded-2xl border border-slate-300 shadow-xl overflow-hidden">

            <div class="px-5 sm:px-6 md:px-8 py-5 border-b border-slate-200 bg-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-lime-300 text-red-700 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-800">Fee Item Details</h2>
                </div>
            </div>

            <div class="p-5 sm:p-6 md:p-8">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-6">
                        <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">
                            School Class <span class="text-red-500">*</span>
                        </label>
                        <select name="schoolclass" required class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                            <option value="">Select Class</option>
                            {% for class in schoolclasses %}
                                <option value="{{ class.id }}" {% if feeitem.schoolclass.id == class.id %}selected{% endif %}>
                                    {{ class.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-6">
                        <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">
                            Fee Type <span class="text-red-500">*</span>
                        </label>
                        <select name="fee_type" required class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                            <option value="">Select Fee Type</option>
                            {% for value, label in fee_types %}
                                <option value="{{ value }}" {% if feeitem.fee_type == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">
                            Amount <span class="text-red-500">*</span>
                        </label>
                        <input type="number" name="amount" step="0.01" min="0" value="{{ feeitem.amount }}" required placeholder="Enter fee amount" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-400 flex flex-col sm:flex-row sm:justify-end gap-3">
                        <button type="submit" class="w-full sm:w-auto px-7 py-3 rounded-xl bg-sky-700 text-white text-md font-semibold shadow-md transition duration-200 hover:bg-blue-500 hover:shadow-xl">Save Fee Item</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
