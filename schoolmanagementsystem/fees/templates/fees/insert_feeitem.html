{% extends 'school_admin/base.html' %}

{% block title %}Add Fee Item{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Fee Item</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">School Class</label>
                        <select name="schoolclass" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Class</option>
                            {% for class in schoolclasses %}
                                <option value="{{ class.id }}" {% if feeitem.schoolclass.id == class.id %}selected{% endif %}>
                                    {{ class.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Fee Type</label>
                        <select name="fee_type" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Fee Type</option>
                            {% for value, label in fee_types %}
                                <option value="{{ value }}" {% if feeitem.fee_type == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Amount</label>
                        <input type="number" name="amount" step="0.01" min="0" value="{{feeitem.amount}}" required placeholder="Enter fee amount" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Save Fee Item</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
