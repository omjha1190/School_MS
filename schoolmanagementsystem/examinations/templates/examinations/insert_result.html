{% extends 'school_admin/base.html' %}

{% block title %}Add Result{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Result</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Result Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="student" class="block text-sm font-medium text-slate-700 mb-2">Student</label>
                            <select id="student" name="student" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                                <option value="">Select Student</option>
                                {% for student in students %}
                                    <option value="{{ student.id }}">
                                        {{ student.user.get_full_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="exam" class="block text-sm font-medium text-slate-700 mb-2">Exam</label>
                            <select id="exam" name="exam" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                                <option value="">Select Exam</option>
                                {% for exam in exams %}
                                    <option value="{{ exam.id }}">
                                        {{ exam.name }} - {{ exam.schoolclass.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="subject" class="block text-sm font-medium text-slate-700 mb-2">Subject</label>
                            <select id="subject" name="subject" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                                <option value="">Select Subject</option>
                                {% for subject in subjects %}
                                    <option value="{{ subject.id }}">
                                        {{ subject.name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div>
                            <label for="marks" class="block text-sm font-medium text-slate-700 mb-2">Marks</label>
                            <input type="number" id="marks" name="marks" min="0" placeholder="Enter marks" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Add Result</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
