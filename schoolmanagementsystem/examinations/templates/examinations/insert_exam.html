{% extends 'school_admin/base.html' %}

{% block title %}Add Exam{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Exam</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div>
                    <h2 class="text-xl font-semibold text-slate-800 mb-6">Exam Information</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-slate-700 mb-2">Exam Name</label>
                            <input type="text" id="name" name="name" value="{{exam.name}}" placeholder="e.g. Half Yearly Examination" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                        </div>
                        <div>
                            <label for="date" class="block text-sm font-medium text-slate-700 mb-2">Exam Date</label>
                            <input type="date" id="date" name="date" value="{{ exam.date|date:'Y-m-d' }}" class="w-full border border-slate-300 rounded-lg px-4 py-3 shadow-sm">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-medium text-slate-700 mb-4">Select Classes</label>
                            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                                {% for schoolclass in schoolclasses %}
                                    <label class="flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 cursor-pointer hover:bg-slate-50">
                                        <input type="checkbox" name="schoolclasses" value="{{ schoolclass.id }}" class="w-4 h-4">
                                        <span class="text-slate-700">{{ schoolclass.name }}</span>
                                    </label>
                                {% endfor %}
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Add Exam</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
