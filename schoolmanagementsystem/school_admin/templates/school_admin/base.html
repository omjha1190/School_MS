<!DOCTYPE html>

                <p class="text-sm text-slate-300 mt-1">Admin Panel</p>
            </div>
            <nav class="p-4 ">

                <a href="{% url "manage_teachers" %}" class="block px-4 py-3 rounded-lg text-slate-200 hover:bg-slate-700 mb-2">Teachers</a>

                <a href="" class="block px-4 py-3 rounded-lg text-slate-200 hover:bg-slate-700 mb-2">Fees</a>
                <a href="" class="block px-4 py-3 rounded-lg text-slate-200 hover:bg-slate-700 mb-2">Transport</a>
                <a href="" class="block px-4 py-3 rounded-lg text-slate-200 hover:bg-slate-700">Staff Payments</a>
            </nav>
        </div>
            {% block content %}

</html>
