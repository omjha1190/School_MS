{% extends 'school_admin/base.html' %}

{% block title %}Add Exam{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Exam</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Exam Name</label>
                        <input type="text" name="exam_name" value="{{exam.exam_name}}" required placeholder="Enter exam name" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Academic Year</label>
                        <input type="text" name="academic_year" value="{{exam.academic_year}}" required placeholder="Example: 2026-27" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-4">Select Classes</label>
                        <div class="grid grid-cols-2 gap-3">
                            {% for schoolclass in schoolclasses %}
                                <label class="flex items-center gap-3 border border-slate-300 rounded-lg px-4 py-3 cursor-pointer hover:bg-slate-50">
                                    <input type="checkbox" name="schoolclasses" value="{{ schoolclass.id }}" class="w-4 h-4" {% if schoolclass in exam.schoolclass.all %}checked{% endif %}>
                                    <span class="text-slate-700">{{ schoolclass.name }}</span>
                                </label>
                            {% endfor %}
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Exam Mode</label>
                        <select name="mode" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            {% for value, label in exam_modes %}
                                <option value="{{ value }}" {% if exam.mode == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Status</label>
                        <select name="status" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            {% for value, label in exam_status %}
                                <option value="{{ value }}" {% if exam.status == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Start Date</label>
                        <input type="date" name="start_date" value="{{exam.start_date|date:"Y-m-d"}}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">End Date</label>
                        <input type="date" name="end_date" value="{{exam.end_date|date:"Y-m-d"}}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Exam Instructions</label>
                        <textarea name="instructions" rows="5" placeholder="Enter exam instructions" class="w-full border border-slate-300 rounded-lg px-4 py-3">{{exam.instructions}}</textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Description</label>
                        <textarea name="description" rows="5" placeholder="Enter exam description" class="w-full border border-slate-300 rounded-lg px-4 py-3">{{exam.description}}</textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-4 mt-8">
                    <a href="" class="px-5 py-3 rounded-lg border border-slate-300 text-slate-700 font-medium hover:bg-slate-50">Cancel</a>
                    <button type="submit" class="px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700">Save Exam</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
