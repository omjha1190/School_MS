{% extends 'school_admin/base.html' %}

{% block title %}Add Exam Schedule{% endblock title %}

{% block content %}
<div class="flex-1 p-8">
    <div class="px-10">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Exam Schedule</h1>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <form method="POST">
                {% csrf_token %}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Exam</label>
                        <select name="exam" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Exam</option>
                            {% for exam in exams %}
                                <option value="{{ exam.id }}" {% if examschedule.exam.id == exam.id %}selected{% endif %}>
                                    {{ exam.exam_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Section</label>
                        <select name="section" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Section</option>
                            {% for section in sections %}
                                <option value="{{ section.id }}" {% if examschedule.section.id == section.id %}selected{% endif %}>
                                    {{ section }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Subject</label>
                        <select name="subject" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Subject</option>
                            {% for subject in subjects %}
                                <option value="{{ subject.id }}" {% if examschedule.subject.id == subject.id %}selected{% endif %}>
                                    {{ subject.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Exam Date</label>
                        <input type="date" name="exam_date" value="{{examschedule.exam_date|date:"Y-m-d"}}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Start Time</label>
                        <input type="time" name="start_time" value="{{examschedule.start_time|time:"h:i"}}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">End Time</label>
                        <input type="time" name="end_time" value="{{examschedule.end_time|time:"H:i"}}" required class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Room</label>
                        <input type="text" name="room_no" value="{{examschedule.room_no}}" required placeholder="Enter room number" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Maximum Marks</label>
                        <input type="number" name="max_marks" step="0.01" min="0" value="{{examschedule.max_marks}}" required placeholder="Example: 100" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 rounded-lg bg-slate-800 text-white font-medium hover:bg-slate-700 mt-8">Save Schedule</button>
            </form>
        </div>
    </div>
</div>

{% endblock content %}
