{% extends "school_admin/base.html" %}

{% block title %}Add Staff{% endblock title %}

{% block content %}
<div class="flex-1 bg-sky-50 font-['Inter'] min-h-screen">
    <div class="bg-white px-4 sm:px-6 lg:px-8 py-5 sm:py-6 shadow-lg mb-6 sm:mb-10">
        <div class="flex items-center gap-3">
            <div class="w-1.5 h-9 bg-rose-700 rounded-full"></div>
            <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-slate-900">Add Staff</h1>
        </div>
    </div>

    <div class="px-4 sm:px-8 md:px-16 lg:px-[10%] xl:px-[15%] pb-10">
        <div class="bg-white rounded-2xl border border-slate-300 shadow-xl overflow-hidden">

            <div class="px-5 sm:px-6 md:px-8 py-5 border-b border-slate-200 bg-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-lime-300 text-red-700 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                        </svg>
                    </div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-800">Staff Details</h2>
                </div>
            </div>

            <div class="p-5 sm:p-6 md:p-8">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Staff Name</label>
                            <input type="text" name="name" value="{{staff.name}}" placeholder="Enter staff name" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Cover Image</label>
                            <input type="file" name="cover_image" accept="image/*" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Staff Type</label>
                            <select name="staff_type" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                                <option value="">Select Staff Type</option>
                                {% for value, label in staff_types %}
                                    <option value="{{ value }}" {% if staff.staff_types == value %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Gender</label>
                            <select name="gender" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base bg-white focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                                <option value="">Select Gender</option>
                                {% for value, label in gender_choices %}
                                    <option value="{{ value }}" {% if staff.gender == value %}selected{% endif %}>
                                        {{ label }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Phone Number</label>
                            <input type="text" name="phone" value="{{staff.phone}}" placeholder="Enter phone number" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Email</label>
                            <input type="email" name="email" value="{{staff.email}}" placeholder="Enter email address" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Joining Date</label>
                            <input type="date" name="joining_date" value="{{staff.joining_date|date:"Y-m-d"}}" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div>
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Monthly Salary</label>
                            <input type="number" name="salary" step="0.01" min="0" value="{{staff.salary}}" placeholder="Enter monthly salary" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-base sm:text-lg font-semibold text-slate-800 mb-2">Address</label>
                            <textarea name="address" rows="4" placeholder="Enter staff address" class="w-full border border-slate-300 rounded-xl px-3 sm:px-4 py-3 text-sm sm:text-base focus:outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100 transition duration-200">{{staff.address}}</textarea>
                        </div>

                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-400 flex flex-col sm:flex-row sm:justify-end gap-3">
                        <button type="submit" class="w-full sm:w-auto px-7 py-3 rounded-xl bg-sky-700 text-white text-md font-semibold shadow-md transition duration-200 hover:bg-blue-500 hover:shadow-xl">Save Staff</button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
