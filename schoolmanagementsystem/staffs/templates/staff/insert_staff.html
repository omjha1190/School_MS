{% extends "school_admin/base.html" %}

{% block title %}Add Staff{% endblock title %}

{% block content %}

<div class="flex-1 p-8">

    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-semibold text-slate-800 mb-8">Add Staff</h1>
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Staff Name</label>
                        <input type="text" name="name" value="{{staff.name}}" placeholder="Enter staff name" class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Cover Image</label>
                        <input type="file" name="cover_image" accept="image/*" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Staff Type</label>
                        <select name="staff_type" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Staff Type</option>
                            {% for value, label in staff_types %}
                                <option value="{{ value }}" {% if staff.staff_types == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Gender</label>
                        <select name="gender" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                            <option value="">Select Gender</option>
                            {% for value, label in gender_choices %}
                                <option value="{{ value }}" {% if staff.gender == value %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
                        <input type="text" name="phone" value="{{staff.phone}}" placeholder="Enter phone number" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
                        <input type="email" name="email" value="{{staff.email}}" placeholder="Enter email address" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Joining Date</label>
                        <input type="date" name="joining_date" value="{{staff.joining_date|date:"Y-m-d"}}" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Monthly Salary</label>
                        <input type="number" name="salary" step="0.01" min="0" value="{{staff.salary}}" placeholder="Enter monthly salary" class="w-full border border-slate-300 rounded-lg px-4 py-3">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Address</label>
                        <textarea name="address" rows="4" placeholder="Enter staff address" class="w-full border border-slate-300 rounded-lg px-4 py-3">{{staff.address}}</textarea>
                    </div>
                </div>
                <button type="submit" class="w-full px-6 py-3 bg-slate-800 text-white rounded-lg hover:bg-slate-700 mt-6">Save Staff</button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
